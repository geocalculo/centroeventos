<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mi Pimiento | Administración de agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5efe6;--paper:#fbf8f3;--ink:#1f2a1c;--muted:#6b6a5f;--line:#e3dacb;--olive:#24301f;--ok:#3f7d4b;--ok-bg:#e6f0e3;--res:#8a5a44;--res-bg:#f1dfd4;--terra:#b9603a;--sans:Manrope,system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  h1{font-family:Fraunces,serif;font-weight:400;font-size:1.6rem}
  .sub{color:var(--muted);font-size:.85rem}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
  .salir{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:600 .82rem var(--sans);cursor:pointer;color:var(--muted)}
  input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:500 1rem var(--sans);margin-bottom:10px;background:var(--paper)}
  .btn{width:100%;padding:15px;border:0;border-radius:12px;font:700 1rem var(--sans);cursor:pointer;background:var(--olive);color:#fff}
  .btn:disabled{opacity:.5}
  .err{color:#a33;font-size:.88rem;min-height:1.2em;margin-top:8px}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .cal-head h3{font-family:Fraunces,serif;font-weight:400;font-size:1.3rem;text-transform:capitalize}
  .nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:1.1rem}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{text-align:center;font-size:.7rem;font-weight:700;color:var(--muted);padding:4px 0}
  .cal-day{aspect-ratio:1;border-radius:10px;border:2px solid transparent;font:700 .95rem var(--sans);cursor:pointer;position:relative}
  .cal-day.disponible{background:var(--ok-bg);color:var(--ok)}
  .cal-day.reservado{background:var(--res-bg);color:var(--res)}
  .cal-day.cerrado{background:#f3efe8;color:#aaa395}
  .cal-day.pasada{background:transparent;color:#cfc8bc;cursor:default}
  .cal-day.sel{border-color:var(--olive)}
  .cal-day.hoy::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
  .leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.8rem;color:var(--muted)}
  .leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .accion{margin-top:14px;display:none}
  .accion.on{display:block}
  .accion .f{font-family:Fraunces,serif;font-size:1.35rem}.lista .fl{display:block}.accion .f::first-letter,.lista .fl::first-letter{text-transform:uppercase}
  .accion .e{font-size:.88rem;color:var(--muted);margin:2px 0 12px}
  .btn.bloq{background:var(--terra)}
  .btn.lib{background:var(--ok)}
  h2{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .lista{list-style:none}
  .lista li{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-weight:600;font-size:.92rem}
  .lista button{background:none;border:0;color:var(--ok);font:700 .82rem var(--sans);cursor:pointer;text-transform:none}
  .demo{background:#fff3cd;border:1px solid #f0d78a;color:#6b4f00;font-size:.82rem;padding:10px 12px;border-radius:10px;margin-bottom:14px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--olive);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  .ver{display:block;text-align:center;margin-top:24px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<script src="config.js"></script>
<div class="wrap">
  <header>
    <div><h1>Agenda</h1><div class="sub" id="marca"></div></div>
    <button class="salir" id="salir" hidden>Salir</button>
  </header>

  <div id="demoMsg" class="demo" hidden>Modo demo: los cambios se guardan solo en este navegador. Conecta Firebase en <b>config.js</b> para que se vean en la web.</div>

  <!-- Login -->
  <form class="card" id="login" hidden>
    <p class="sub" style="margin-bottom:12px">Ingresa con la cuenta de administrador.</p>
    <input type="email" id="email" placeholder="Correo" autocomplete="username" required>
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn" id="entrar">Entrar</button>
    <div class="err" id="err"></div>
  </form>

  <!-- Panel -->
  <div id="panel" hidden>
    <div class="card">
      <div class="cal-head">
        <h3 id="mesTitulo"></h3>
        <div class="nav"><button id="prev" aria-label="Mes anterior">‹</button> <button id="next" aria-label="Mes siguiente">›</button></div>
      </div>
      <div id="cal"></div>
      <div class="leyenda">
        <span><i style="background:var(--ok-bg)"></i>Disponible</span>
        <span><i style="background:var(--res-bg)"></i>Bloqueada/reservada</span>
        <span><i style="background:#f3efe8"></i>Día no habilitado</span>
      </div>
      <div class="accion" id="accion">
        <div class="f" id="accFecha"></div>
        <div class="e" id="accEstado"></div>
        <button class="btn" id="accBtn"></button>
      </div>
    </div>

    <h2>Próximas fechas bloqueadas</h2>
    <ul class="lista" id="lista"></ul>
    <a class="ver" href="index.html" target="_blank">Ver la web pública ↗</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="calendario.js"></script>
<script type="module">
const C = Cal.C;
const $ = (id) => document.getElementById(id);
$("marca").textContent = C.nombre;

const toast = (t) => { $("toast").textContent = t; $("toast").classList.add("on"); setTimeout(() => $("toast").classList.remove("on"), 1800); };

let mapa = {}, sel = null, unsub = null;
const h = Cal.hoy();
const min = new Date(h.getFullYear(), h.getMonth(), 1);
const max = new Date(h.getFullYear(), h.getMonth() + C.mesesVisibles + 6, 1);
let mes = new Date(min);

function pintar() {
  $("mesTitulo").textContent = `${Cal.MESES[mes.getMonth()]} ${mes.getFullYear()}`;
  $("prev").disabled = mes <= min; $("next").disabled = mes >= max;
  Cal.render({ el: $("cal"), mapa, mes, seleccion: sel, admin: true, onSelect: elegir });
  if (sel) mostrarAccion();
  // lista
  const prox = Object.keys(mapa).filter(f => Cal.desdeIso(f) >= h).sort();
  $("lista").innerHTML = prox.length ? prox.map(f =>
    `<li><span class="fl">${Cal.largo(Cal.desdeIso(f))}</span><button data-f="${f}">Liberar</button></li>`).join("")
    : `<li style="text-transform:none;color:var(--muted);font-weight:500">No hay fechas bloqueadas.</li>`;
  $("lista").querySelectorAll("button").forEach(b => b.onclick = () => cambiar(b.dataset.f, false));
}
function elegir(f) { sel = f; pintar(); }
function mostrarAccion() {
  const d = Cal.desdeIso(sel), reservado = mapa[sel] === "reservado";
  const habil = C.diasHabilitados.includes(d.getDay());
  $("accion").classList.add("on");
  $("accFecha").textContent = Cal.largo(d);
  $("accEstado").textContent = reservado ? "Estado: bloqueada / reservada" : (habil ? "Estado: disponible" : "Día no habilitado en config.js (se verá como no disponible)");
  const b = $("accBtn");
  b.className = "btn " + (reservado ? "lib" : "bloq");
  b.textContent = reservado ? "Liberar fecha" : "Bloquear fecha";
  b.onclick = () => cambiar(sel, !reservado);
}
async function cambiar(f, reservar) {
  const b = $("accBtn"); b.disabled = true;
  try { await Cal.setEstado(f, reservar); toast(reservar ? "Fecha bloqueada" : "Fecha liberada"); }
  catch (e) { console.error(e); toast("Error: sin permisos o sin conexión"); }
  b.disabled = false;
}
$("prev").onclick = () => { mes.setMonth(mes.getMonth() - 1); pintar(); };
$("next").onclick = () => { mes.setMonth(mes.getMonth() + 1); pintar(); };

async function abrirPanel() {
  $("login").hidden = true; $("panel").hidden = false;
  pintar();
  unsub = await Cal.suscribir((m) => { mapa = m; pintar(); });
}

if (!Cal.configurado) {
  $("demoMsg").hidden = false;
  abrirPanel();
} else {
  const { app } = await Cal.initFirebase();
  const A = await import(Cal.FB("auth"));
  const auth = A.getAuth(app);
  A.onAuthStateChanged(auth, (u) => {
    if (u) { $("salir").hidden = false; abrirPanel(); }
    else { $("salir").hidden = true; $("panel").hidden = true; $("login").hidden = false; if (unsub) { unsub(); unsub = null; } }
  });
  $("login").onsubmit = async (e) => {
    e.preventDefault(); $("err").textContent = ""; $("entrar").disabled = true;
    try { await A.signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
    catch (er) { $("err").textContent = "Correo o contraseña incorrectos."; }
    $("entrar").disabled = false;
  };
  $("salir").onclick = () => A.signOut(auth);
}
</script>
</body>
</html>
